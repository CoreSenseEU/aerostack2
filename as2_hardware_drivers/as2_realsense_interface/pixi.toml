# Package manifest for Pixi: builds this ROS 2 package as a conda package.
# Name, version and dependencies come from package.xml. See the CoreSense
# guide: https://coresenseeu.github.io/tutorials/docs/pixi_release.html
[package]
publish = true

[package.build.backend]
name = "pixi-build-ros"
workspace = true

# librealsense2 is a ROS package in RoboStack Jazzy but not in Kilted: use the
# conda-forge library directly.
[[package.build.config.extra-package-mappings]]
librealsense2 = { conda = ["librealsense"] }

[package.build.config]
# Some dependencies fetched at build time declare a CMake minimum below 3.5,
# which CMake 4 rejects.
# Aerostack2 uses EIGEN3_INCLUDE_DIRS, which Eigen 5 no longer defines: make
# the Eigen headers visible to the compiler.
env = { CMAKE_POLICY_VERSION_MINIMUM = "3.5", CPATH = "$PREFIX/include/eigen3" }
